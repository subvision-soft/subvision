<div class="sessions">
  <button sessionItem *ngIf="pathString.length > 0" [file]="returnFile" (click)="back()"
          [goBack]="true"></button>
  <app-empty-text *ngIf="sessions.length === 0" [icon]="'jamGhost'"
                  [text]="'Le dossier est vide'"></app-empty-text>

  <button sessionItem
          (click)="open(session)" [file]="session"
          *ngFor="let session of sessions">
  </button>
</div>
